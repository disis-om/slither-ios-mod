<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slither.io Mod</title>
    <style>
html, body {
    font-family: Arial, sans-serif;
    padding: 20px;
    color: #628a41;
    transform: rotate(45deg) translate(0,50px);
    -webkit-user-select: none;
    touch-action: manipulation;
    justify-content: center;
    align-items: center;
}
        label {
            display: block;
            margin: 5px 0;
        }
        button {
            margin-top: 10px;
        }
        #tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        #tabs button {
            margin-top: 0;
            flex: 1;
            padding: 6px 4px;
            font-size: 13px;
            border: none;
            border-radius: 4px;
            background: #628a4133;
            color: #628a41;
        }
        #tabs button.on {
            background: #628a4188;
            color: #dff0c8;
        }
        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #628a41aa;
            min-height: 14px;
            word-break: break-word;
        }
        .row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 6px 0;
        }
        .row button { margin-top: 0; flex: 1; font-size: 12px; padding: 5px 2px; }
        input[type=text], textarea {
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            background: #0003;
            color: #628a41;
            border: 1px solid #628a4155;
            border-radius: 3px;
            padding: 4px;
        }
        textarea { height: 54px; resize: none; }
        .hint { font-size: 11px; color: #628a4199; margin: 4px 0; line-height: 1.35; }
    </style>
</head>
<body>

<div id="tabs">
    <button id="tabCheats" class="on" onclick="showTab('cheats')">Cheats</button>
    <button id="tabSkin" onclick="showTab('skin')">Skin code</button>
</div>

<div id="paneCheats">
    <label><input type="checkbox" id="cb1"> Remove background</label>
    <label><input type="checkbox" id="cb2"> Hide boost effect</label>
    <label><input type="checkbox" id="cb3"> Hide menu icon</label>
    <label><input type="checkbox" id="cb4"> Lightweight food</label>
    <label><input type="checkbox" id="cb5"> Lightweight score</label>
</div>

<div id="paneSkin" hidden>
    <div class="hint">
        Build any skin once in Build a Slither, so the game is in custom-skin
        mode. After that: type a code, press ON, then press Play.
    </div>

    <textarea id="skinCode" placeholder="zzxxccvvbbnnmm,,aassddffgg"></textarea>
    <div class="row">
        <button onclick="skinOn()">ON</button>
        <button onclick="readSkin()">Read current</button>
    </div>

    <div id="skinAdvanced" hidden>
        <div class="hint">
            Could not find the skin bytes on its own. Open Build a Slither,
            press Locate, change one bead, press Locate again.
        </div>
        <div class="row">
            <button onclick="locate()">Locate</button>
            <input type="text" id="skinOffset" placeholder="-0x1c0">
            <button onclick="useOffset()">Use</button>
        </div>
    </div>
</div>

<div id="status"></div>

    <script>
// Position the window first. The original script did this last, so whenever
// the memory scan failed the panel was left unpositioned as well as broken.
setWindowRect(90, 80, 350, 400);
setWindowDrag(0, 0, 400, 400);

var ANCHOR = '31337';      // F64 sentinel that only exists while a match runs
var baseAddress = null;

function status(text) {
    var el = document.getElementById('status');
    if (el) el.textContent = text || '';
}

function showTab(which) {
    document.getElementById('paneCheats').hidden = which !== 'cheats';
    document.getElementById('paneSkin').hidden = which !== 'skin';
    document.getElementById('tabCheats').className = which === 'cheats' ? 'on' : '';
    document.getElementById('tabSkin').className = which === 'skin' ? 'on' : '';
    status('');
}

// Scans on demand and returns null instead of throwing when the anchor is not
// in memory. The original did `results[0].address` with no guard, which threw
// on the menu screen and took the rest of the script down with it.
function resolveBase(force) {
    if (baseAddress && !force) return baseAddress;
    if (typeof h5gg === 'undefined') return null;
    try {
        h5gg.clearResults();
        h5gg.searchNumber(ANCHOR, 'F64', '0x270000000', '0x7100000000');
        if (h5gg.getResultsCount() < 1) return null;
        var results = h5gg.getResults(1, 0);
        if (!results || !results.length || !results[0]) return null;
        baseAddress = results[0].address;
        return baseAddress;
    } catch (e) {
        return null;
    }
}

function addressFor(offset) {
    var base = resolveBase(false);
    if (base === null) {
        baseAddress = null;      // the anchor moves between matches
        base = resolveBase(true);
    }
    if (base === null) return null;
    return '0x' + (parseInt(base, 16) + offset).toString(16);
}

// Holds `onValue` at `offset` while checked, restores `offValue` when cleared.
function bindFreeze(id, offset, onValue, offValue, intervalMs) {
    var locker = null;
    var box = document.getElementById(id);
    if (!box) return;
    box.addEventListener('change', function() {
        try {
            if (this.checked) {
                var addr = addressFor(-offset);
                if (addr === null) {
                    this.checked = false;
                    status('Join a game first');
                    return;
                }
                locker = setInterval(function() {
                    h5gg.setValue(addr, onValue, 'F64');
                }, intervalMs);
                status('');
            } else if (locker !== null) {
                clearInterval(locker);
                locker = null;
                var restore = addressFor(-offset);
                if (restore !== null) h5gg.setValue(restore, offValue, 'F64');
            }
        } catch (e) {
            status('Toggle failed');
        }
    });
}

bindFreeze('cb1', 0x260, 0,     20000, 250);
bindFreeze('cb2', 0x2d8, 99999, 5.39,  250);
bindFreeze('cb4', 0x368, 0.4,   0.91,  1);
bindFreeze('cb5', 0x400, 75,    52,    250);

// Swaps the floating menu button between a transparent image and its own art.
// Needs no memory access, so it keeps working outside a match.
document.getElementById('cb3').addEventListener('change', function() {
    try {
        setButtonImage(this.checked ? "__BLANK_ICON__" : "__REAL_ICON__");
    } catch (e) {
        status('Could not change the menu icon');
    }
});

/* ------------------------------------------------------------------ *
 * Skin code
 *
 * This does not touch slither's protocol. The game already builds and
 * sends the custom-skin packet - that is what Build a Slither is - so
 * all this does is put the beads where the builder puts them and let
 * the game's own Play send them.
 *
 * NTL's alphabet: one character per bead, the character's position in
 * this string is its colour-group index. Taken from Wyrm's ntl_cg_map,
 * which is the same table NTL 9.68 uses. '*' marks a disabled group.
 * ------------------------------------------------------------------ */
var SKIN_ALPHABET = "zxcvbnm,asdfghjklqwertyuiop123456789*0*-**";
var SKIN_MAX = 256;          // MAX_SKIN_CODE_LEN
var SCAN_FROM = -0x800;      // window searched for the skin bytes
var SCAN_TO = 0x400;
var MIN_RUN = 24;            // shorter than this is not a skin array
var skinOffset = null;
var located = {};

function byteAt(start, index) {
    return Number(h5gg.getValue('0x' + (start + index).toString(16), 'I8')) & 255;
}

/* Every byte of a skin is a colour-group index, so the array reads as a long
 * run of small numbers inside a struct that is otherwise doubles and
 * pointers. That is enough to find it without making anyone hunt for it.
 * Runs of pure zero are skipped, because padding looks the same otherwise. */
function skinCandidates() {
    var base = addressFor(0);
    if (base === null) return [];
    var start = parseInt(base, 16);

    var runs = [];
    var runStart = null, nonZero = 0, distinct = {}, distinctCount = 0;

    function close(end) {
        if (runStart !== null && end - runStart >= MIN_RUN && nonZero > 0) {
            runs.push({ offset: runStart, length: end - runStart,
                        variety: distinctCount });
        }
        runStart = null; nonZero = 0; distinct = {}; distinctCount = 0;
    }

    for (var off = SCAN_FROM; off < SCAN_TO; off++) {
        var value = byteAt(start, off);
        if (value < SKIN_ALPHABET.length) {
            if (runStart === null) runStart = off;
            if (value !== 0) {
                nonZero++;
                if (!distinct[value]) { distinct[value] = 1; distinctCount++; }
            }
        } else {
            close(off);
        }
    }
    close(SCAN_TO);

    // Longest first, and among equals the one carrying more distinct colours.
    runs.sort(function(a, b) {
        return (b.length - a.length) || (b.variety - a.variety);
    });
    return runs;
}

function parseOffset(text) {
    if (!text) return null;
    text = ('' + text).trim();
    var negative = text.charAt(0) === '-';
    if (negative) text = text.slice(1);
    var value = parseInt(text, 16);
    if (!isFinite(value)) return null;
    return negative ? -value : value;
}

function useOffset() {
    var box = document.getElementById('skinOffset');
    var value = parseOffset(box && box.value);
    if (value === null) {
        status('Offset must look like -0x1c0');
        return;
    }
    skinOffset = value;
    status('Using ' + (value < 0 ? '-0x' : '0x') + Math.abs(value).toString(16));
}

function showAdvanced() {
    var panel = document.getElementById('skinAdvanced');
    if (panel) panel.hidden = false;
}

/* Fallback for when the scan cannot pick the array out on its own: read the
 * window twice around a manual bead change and keep whatever moved. */
function locate() {
    try {
        var base = addressFor(0);
        if (base === null) { status('Join a game first'); return; }
        var start = parseInt(base, 16);
        var now = [];
        for (var off = SCAN_FROM; off < SCAN_TO; off++) now.push(byteAt(start, off));

        if (!located.before) {
            located.before = now;
            status('Read. Now change one bead and press Locate again.');
            return;
        }
        for (var i = 0; i < now.length; i++) {
            if (now[i] !== located.before[i]) {
                skinOffset = SCAN_FROM + i;
                located.before = null;
                var box = document.getElementById('skinOffset');
                if (box) box.value = (skinOffset < 0 ? '-0x' : '0x') +
                                     Math.abs(skinOffset).toString(16);
                status('Found the skin bytes. Press ON.');
                return;
            }
        }
        located.before = now;
        status('Nothing moved. Change a bead, then press Locate again.');
    } catch (e) {
        status('Locate failed');
    }
}

function codeToBytes(code) {
    var bytes = [];
    for (var i = 0; i < code.length && bytes.length < SKIN_MAX; i++) {
        var index = SKIN_ALPHABET.indexOf(code.charAt(i));
        if (index < 0) return { error: code.charAt(i) };
        bytes.push(index);
    }
    return { bytes: bytes };
}

/* Writes and then reads back. A region that will not hold the bytes is not
 * the skin, so the next candidate gets a turn instead of a silent failure. */
function writeAt(offset, bytes) {
    var base = addressFor(offset);
    if (base === null) return false;
    var start = parseInt(base, 16);
    var i;
    for (i = 0; i < bytes.length; i++) {
        h5gg.setValue('0x' + (start + i).toString(16), bytes[i], 'I8');
    }
    for (i = 0; i < bytes.length; i++) {
        if (byteAt(start, i) !== bytes[i]) return false;
    }
    return true;
}

function skinOn() {
    try {
        var code = (document.getElementById('skinCode').value || '').trim();
        if (!code.length) { status('Type a skin code first'); return; }

        var parsed = codeToBytes(code);
        if (parsed.error) {
            status('Not in the alphabet: ' + parsed.error);
            return;
        }
        if (resolveBase(false) === null && resolveBase(true) === null) {
            status('Join a game first');
            return;
        }

        var offsets = skinOffset !== null ? [skinOffset] : [];
        if (!offsets.length) {
            var runs = skinCandidates();
            for (var i = 0; i < runs.length && i < 6; i++) offsets.push(runs[i].offset);
        }
        if (!offsets.length) {
            status('Could not find the skin bytes');
            showAdvanced();
            return;
        }

        for (var j = 0; j < offsets.length; j++) {
            if (writeAt(offsets[j], parsed.bytes)) {
                skinOffset = offsets[j];
                status('On - ' + parsed.bytes.length + ' beads. Press Play.');
                return;
            }
        }
        status('Wrote nothing that stuck');
        showAdvanced();
    } catch (e) {
        status('Failed');
        showAdvanced();
    }
}

function readSkin() {
    try {
        if (resolveBase(false) === null && resolveBase(true) === null) {
            status('Join a game first');
            return;
        }
        var offset = skinOffset;
        if (offset === null) {
            var runs = skinCandidates();
            if (!runs.length) {
                status('Could not find the skin bytes');
                showAdvanced();
                return;
            }
            offset = runs[0].offset;
        }
        var base = addressFor(offset);
        if (base === null) { status('Join a game first'); return; }
        var start = parseInt(base, 16);

        var code = '';
        for (var i = 0; i < SKIN_MAX; i++) {
            var value = byteAt(start, i);
            if (value >= SKIN_ALPHABET.length) break;
            code += SKIN_ALPHABET.charAt(value);
        }
        document.getElementById('skinCode').value = code;
        skinOffset = offset;
        status(code.length ? ('Read ' + code.length + ' beads') : 'Nothing readable there');
    } catch (e) {
        status('Read failed');
    }
}

if (resolveBase(false) === null) status('Join a game first');
    </script>

</body>
</html>
